<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIO Enroll</title>
<link rel="stylesheet" href="guide.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="picker" class="gate" hidden data-tauri-drag-region>
  <div class="who2">
    <img class="logo" src="icon.svg" alt="">
    <h1>Who’s signing in?</h1>
    <p class="sub" id="pickMsg"></p>
    <div class="tiles" id="tiles"></div>
  </div>
</main>

<main id="signin" class="gate" hidden data-tauri-drag-region>
  <form id="signinForm" class="narrow" autocomplete="on">
    <img class="logo" src="icon.svg" alt="">
    <h1>AIO Enroll</h1>
    <p class="sub">Sign in with your MDM account.</p>
    <div class="group form">
      <label class="row"><span class="k">Email</span><input id="u" name="username" autocomplete="username" placeholder="name@aioapp.com" required></label>
      <label class="row"><span class="k">Password</span><input id="p" name="password" type="password" autocomplete="current-password" placeholder="Required" required></label>
    </div>
    <label class="chk2"><input type="checkbox" id="remember" checked> Remember my password on this Mac</label>
    <p id="signinErr" class="err" role="alert"></p>
    <div class="formacts"><button type="button" class="cc-btn" id="backToPicker" hidden>Back</button><button class="cc-btn primary" id="signinBtn">Sign In</button></div>
  </form>
</main>

<div id="app" hidden>
  <aside class="side" aria-label="Devices">
    <div class="side-top" data-tauri-drag-region></div>
    <div class="side-scroll">
      <label class="search" id="searchBox"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" placeholder="Search" spellcheck="false" autocomplete="off" aria-label="Search devices by name or serial"><span class="kbd" id="qKey"></span></label>
      <div class="sec">Devices <span class="count" id="devCount"></span></div>
      <div class="rail" id="rail"></div>
      <div id="todayNav"></div>
      <div id="pairNet"></div>
      <div id="foundNet"></div>
      <div id="saved"></div>
    </div>
    <div class="side-foot">
      <div class="status"><span class="dot"></span><span id="foot">Watching for devices</span><span class="sp"></span><span id="today"></span></div>
    </div>
  </aside>
  <div class="sidegrip" id="sidegrip" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset"></div>
  <div class="main">
    <header class="toolbar" data-tauri-drag-region>
      <div class="tt" data-tauri-drag-region><div class="title" id="tbTitle">AIO Enroll</div><div class="sub" id="tbSub"></div></div>
      <span class="sp" data-tauri-drag-region></span>
      <button class="cc-btn primary" id="batchBtn" hidden></button>
      <div class="sitewrap" id="siteWrap" hidden>
        <button class="tbpill" id="siteBtn" aria-haspopup="listbox" title="Where the devices you enrol go"></button>
        <div class="pop2" id="sitePop" role="listbox" hidden><input id="siteQ" placeholder="Search restaurants" spellcheck="false" autocomplete="off"><div id="siteList"></div></div>
      </div>
      <button class="tbtn helpbtn" id="helpBtn" aria-label="Help" title="Help"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.6 2.4c-.7.4-1.1.9-1.1 1.8M12 17h.01"/></svg></button>
      <div class="acctwrap">
        <button class="acct" id="acctBtn" aria-haspopup="menu" title="Account"><span class="pfp" id="pfp" aria-hidden="true"></span><span id="whoName" class="who"></span></button>
        <div class="menu" id="acctMenu" role="menu" hidden>
          <div class="mhead" id="acctMail"></div>
          <div class="mlabel">Appearance</div>
          <div class="seg mseg" id="themeSeg" role="radiogroup" aria-label="Appearance"><span class="th"></span><button data-theme="system" role="radio">Auto</button><button data-theme="light" role="radio">Light</button><button data-theme="dark" role="radio">Dark</button></div>
          <div class="msep"></div>
          <button class="mitem" id="signOut" role="menuitem">Sign Out</button>
        </div>
      </div>
    </header>
    <div class="pbar"><i id="pbar"></i></div>
    <section class="hero" id="hero" aria-live="polite"></section>
  </div>
  <div class="pm-back" id="confirm" hidden>
    <div class="pm-card cf" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <div class="pm-ic cf-ic" id="cfIc"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1M4 4l16 16"/></svg></div>
      <h2 id="cfTitle"></h2>
      <p class="pm-ask" id="cfBody"></p>
      <div class="pm-btns"><button class="cc-btn" id="cfNo">Cancel</button><button class="cc-btn primary danger" id="cfYes">Unpair</button></div>
    </div>
  </div>
  <aside class="drawer" id="drawer" aria-label="Help">
    <div class="dh"><span>Help</span><button class="cc-btn sm" id="drawerX">Done</button></div>
    <div class="dt"><button data-t="phone" class="on">Phone</button><button data-t="pc">Computer</button><button data-t="tr">Trouble?</button></div>
    <div class="db" id="drawerBody"></div>
  </aside>
  <div class="pm-back" id="pairModal" hidden>
    <div class="pm-card" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
      <div class="pm-ic" id="pmIc"></div>
      <h2 id="pmTitle">Pair with a phone</h2>
      <div class="mono pm-meta" id="pmMeta"></div>
      <div class="pm-hint" id="pmHint" hidden></div>
      <p class="pm-ask" id="pmAsk">Enter the 6-digit code shown on the phone.</p>
      <input class="pm-code" id="pmCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off" aria-label="Pairing code">
      <div class="pm-msg" id="pmMsg" role="status"></div>
      <div class="pm-conn" id="pmConn" hidden>
        <label>Phone’s address on its Wireless debugging screen<input id="pmAddr" placeholder="192.168.1.20:41231" autocomplete="off" spellcheck="false"></label>
        <button class="cc-btn primary" id="pmConnBtn">Connect</button>
      </div>
      <div class="pm-btns"><button class="cc-btn" id="pmCancel">Cancel</button><button class="cc-btn primary" id="pmGo" disabled>Pair</button></div>
    </div>
  </div>
</div>
<script src="guide.js"></script>
<script src="app.js"></script>
</body></html>
